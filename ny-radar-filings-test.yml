# Prepared locally; not uploaded or run in GitHub.
# Intended repository path: .github/workflows/ny-radar-filings-test.yml
# Keep the existing Python readiness workflow unchanged.
# A successful run only verifies public-data retrieval, not practice openings.
# Syntax: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# Grouping: https://dev.socrata.com/docs/queries/group.html
name: NY Radar - Read-only filings test

"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: ny-radar-filings-test
  cancel-in-progress: false

jobs:
  filings-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read a small sample of NY filings
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import sys
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          ENDPOINT = "https://data.ny.gov/resource/k4vb-judh.json"
          FIELDS = "dos_id,corp_name,filing_type,filing_date,entity_type,cnty_prin_ofc"
          FILING_TYPES = {"ARTICLES OF ORGANIZATION", "CERTIFICATE OF INCORPORATION"}
          LIMIT = 5
          MAX_BYTES = 1_000_000


          def validate(rows):
              if not isinstance(rows, list) or len(rows) > LIMIT:
                  raise ValueError("Expected a JSON array containing at most five grouped records.")
              candidates = []
              for row in rows:
                  if not isinstance(row, dict):
                      raise ValueError("A returned record is not an object.")
                  required = ("dos_id", "corp_name", "filing_type", "filing_date", "entity_type", "source_rows")
                  if any(not isinstance(row.get(key), str) or not row[key].strip() for key in required):
                      raise ValueError("A required field is missing or has an unexpected type.")
                  if not row["dos_id"].isascii() or not row["dos_id"].isdigit():
                      raise ValueError("Unexpected DOS ID format.")
                  if row["filing_type"] not in FILING_TYPES:
                      raise ValueError("The response contains an unexpected filing type.")
                  if "MEDICAL" not in row["corp_name"].upper() or "PROFESSIONAL" not in row["entity_type"].upper():
                      raise ValueError("A response record does not match the narrow test filter.")
                  datetime.fromisoformat(row["filing_date"])
                  if not row["source_rows"].isascii() or not row["source_rows"].isdigit() or int(row["source_rows"]) < 1:
                      raise ValueError("Unexpected source row count.")
                  county = row.get("cnty_prin_ofc", "")
                  if county is not None and not isinstance(county, str):
                      raise ValueError("Unexpected county field type.")
                  candidate = {key: row[key] for key in required if key != "source_rows"}
                  candidate["cnty_prin_ofc"] = county or "Unknown"
                  candidate["source_rows"] = int(row["source_rows"])
                  candidate["review_status"] = "Needs review"
                  candidates.append(candidate)
              return candidates


          def main():
              params = {
                  "$select": FIELDS + ",count(*) as source_rows",
                  "$where": (
                      "filing_type in ('ARTICLES OF ORGANIZATION','CERTIFICATE OF INCORPORATION') "
                      "AND upper(corp_name) like '%MEDICAL%' "
                      "AND upper(entity_type) like '%PROFESSIONAL%'"
                  ),
                  "$group": FIELDS,
                  "$order": "filing_date DESC,dos_id ASC",
                  "$limit": str(LIMIT),
              }
              request = Request(
                  ENDPOINT + "?" + urlencode(params),
                  headers={"Accept": "application/json", "User-Agent": "NY-Practice-Radar-ReadOnly-Test/1.0"},
                  method="GET",
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      raw = response.read(MAX_BYTES + 1)
                  if len(raw) > MAX_BYTES:
                      raise ValueError("Response exceeds the one-megabyte safety limit.")
                  candidates = validate(json.loads(raw.decode("utf-8")))
              except (HTTPError, URLError, TimeoutError, OSError, ValueError, UnicodeError) as exc:
                  print("READ-ONLY TEST FAILED:", str(exc), file=sys.stderr)
                  print("Stop and inspect the error before retrying. No external records were written.", file=sys.stderr)
                  return 1

              print("Fetched at (UTC):", datetime.now(timezone.utc).isoformat())
              print("Source dataset: k4vb-judh")
              print("Grouped filing records returned:", len(candidates))
              print("Grouping combines matching displayed fields; it is not a persistent entity deduplication system.")
              print("source_rows counts underlying rows, not practices or locations.")
              print("Narrow MEDICAL + PROFESSIONAL sample only; there is no date-window filter or full pagination.")
              print("Filing dates are not verified practice opening dates. All candidates need review.")
              if not candidates:
                  print("NO MATCHES: The request succeeded but returned an empty sample.")
              for candidate in candidates:
                  print(json.dumps(candidate, ensure_ascii=True, sort_keys=True))
              print("Read-only test complete. No Sheets, Salesforce, repository, or notification writes.")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYTHON
