name: NY Radar - Python readiness test

"on":
  workflow_dispatch:

permissions: {}

jobs:
  python-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check Python without fetching data
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import sys
          assert sys.version_info >= (3, 10), "Python 3.10 or newer is required."
          print("Python:", sys.version.split()[0])
          print("Readiness test passed. Practice discovery is not configured.")
          PYTHON
